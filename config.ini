; RTSS Launcher configuration
; Edit this file, then run Install.cmd again to apply changes.

[RTSS]
; Folder containing RTSS.exe. "auto" finds it from the registry or the default install folder.
Path=auto

[Launcher]
; Wait after RTSS starts before launching the game (lets RTSS load its hooks).
StartupDelayMs=2000
; Wait after launching the game before watching for it to close.
; Make this longer if a launcher takes a while to start the real game.
InitialWaitMs=8000
; How often to check whether the game is still running.
PollMs=3000
; Extra check after everything closes, so a launcher handing off to the real game doesn't count as "closed".
GraceMs=5000

[FrameLimits]
; ExeName=FPS. The installer writes these into RTSS's per-game profiles.
; 0 removes the limit. Add a line for any game, then run Install.cmd again.
; Comments must be on their own line; text after a value is read as part of it.
; Use the real game exe, not a launcher, and avoid generic names (Game.exe, Launcher.exe):
; RTSS matches profiles by file name only, so a generic name would cap unrelated programs.
;
; Games below have no working built-in cap and break above the listed rate, per PCGamingWiki.

; Chrome (Techland, 2003): Chrome.exe is the launcher; these are the real game exes.
; Sliding movement and delayed controls at high frame rates.
ChromeSingle.exe=60
ChromeNet.exe=60

; Chrome SpecForce: same engine and sliding issue as Chrome.
SpecForce.exe=60

; Deadly Premonition: The Director's Cut: game speeds up above 60 FPS (windowed or >60 Hz).
DP.exe=60

; Deus Ex: Game of the Year Edition: freezes and stutters at very high frame rates.
DeusEx.exe=120

; Deus Ex: Invisible War: object physics speed up above 60 FPS. dx2.exe starts DX2Main.exe.
DX2Main.exe=60

; Duke Nukem: Manhattan Project: double jump and ledge climbing break above 60 FPS.
prism3d.exe=60

; F.E.A.R., Extraction Point and Perseus Mandate: ragdoll and water physics unstable above 60 FPS.
FEAR.exe=60
FEARXP.exe=60
FEARXP2.exe=60

; F.E.A.R. 2: Project Origin: inaccurate mouse movement above 60 FPS.
FEAR2.exe=60

; Grand Theft Auto IV: vehicle physics and other timing bugs above 60 FPS.
GTAIV.exe=60

; Hitman series (pre-Absolution): physics and game logic tied to 60 FPS.
Hitman.exe=60
hitman2.exe=60
HitmanContracts.exe=60
HitmanBloodMoney.exe=60

; Joe Danger: physics and game logic tied to 60 FPS.
JoeDanger.exe=60

; Situational fixes, off by default. Uncomment while playing that part, then re-run Install.cmd.
; You Are Empty, original 2006 retail release only: image twitches above 60 FPS.
; Not needed for the Absolute Edition (the Steam version), which uses the same exe name:
; you_are_empty.exe=60
; Hydrophobia: Prophecy, Act 3 jump can't be made at high frame rates:
; HydroPC.exe=30
; Kane & Lynch: Dead Men, chapter 4 police car spawns inside the van:
; kaneandlynch.exe=30
; Bully: Scholarship Edition, five missions break at high frame rates:
; Bully.exe=30
; Mirror's Edge Catalyst: uneven mouse camera unless the rate is a multiple of 30 (match your monitor):
; MirrorsEdgeCatalyst.exe=120

[ProfileSettings]
; Any RTSS profile setting, applied to every game above (and every [Profile:...] game).
; Format: Section.Key=Value, exactly as in RTSS\Profiles\<exe>.cfg.
; OSD.EnableOSD=0 turns off "On-Screen Display support". Set to 1 to show the overlay.
OSD.EnableOSD=0

; Per-game overrides (optional). Example:
; [Profile:ChromeNet.exe]
; OSD.EnableOSD=1
